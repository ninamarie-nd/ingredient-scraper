<div class="modal-back" id="scan-modal" hidden>
  <div class="modal scan-modal" role="dialog" aria-modal="true" aria-labelledby="scan-title">
    <h2 id="scan-title">Scan a product label</h2>
    <p class="modal-sub">Take a photo of the ingredient list and we will grade the product. The photo is read on your device and is not uploaded.</p>
    <div class="scan-sources" id="scan-sources">
      <button type="button" class="ask-btn" id="scan-take">Take a photo</button>
      <button type="button" class="ask-btn scan-alt" id="scan-library">Choose from library</button>
    </div>
    <input type="file" id="scan-camera" class="scan-hidden-input" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
    <input type="file" id="scan-file" class="scan-hidden-input" accept="image/*" tabindex="-1" aria-hidden="true">
    <div class="scan-crop" id="scan-crop" hidden>
      <p class="modal-sub">Drag the blue edges to frame just the ingredient list, or use the full photo.</p>
      <canvas id="scan-crop-canvas" class="scan-crop-canvas"></canvas>
      <div class="scan-crop-sliders">
        <label>Top <input type="range" id="crop-top" min="0" max="40" value="0"></label>
        <label>Bottom <input type="range" id="crop-bottom" min="0" max="40" value="0"></label>
        <label>Left <input type="range" id="crop-left" min="0" max="40" value="0"></label>
        <label>Right <input type="range" id="crop-right" min="0" max="40" value="0"></label>
      </div>
      <div class="modal-actions">
        <button type="button" class="link" id="crop-cancel">Cancel</button>
        <button type="button" class="link" id="crop-full">Full photo</button>
        <button type="button" class="ask-btn" id="crop-use">Use this crop</button>
      </div>
    </div>
    <img id="scan-preview" class="scan-preview" alt="Photo of the ingredient list" hidden>
    <p class="modal-status" id="scan-status" role="status"></p>

    <div class="scan-result" id="scan-result" hidden>
      <div id="scan-tier"></div>
      <div id="scan-details"></div>
      <label>Ingredients we read (fix any wrong words, then regrade)<textarea id="scan-text" rows="5" maxlength="8000"></textarea></label>
      <div class="modal-actions"><button type="button" class="link" id="scan-regrade">Regrade</button></div>

      <div class="scan-save">
        <h3>Save this product (optional)</h3>
        <label>Product name<input id="scan-name" maxlength="200" autocomplete="off"></label>
        <label>Brand (optional)<input id="scan-brand" maxlength="120" autocomplete="off"></label>
        <label>Product type<select id="scan-type"></select></label>
        <p class="modal-status" id="scan-save-status" role="status"></p>
        <div class="modal-actions">
          <button type="button" class="link" id="scan-export">Export my scans (.json)</button>
          <button type="button" class="ask-btn" id="scan-save">Save to my scans</button>
        </div>
      </div>
      <div class="modal-actions"><button type="button" class="ask-btn" id="scan-another">Scan another</button></div>
    </div>

    <div class="modal-actions"><button type="button" class="link" id="scan-close">Close</button></div>
  </div>
</div>
